[project]
name = "tax-table-ingestion"
version = "0.1.0"
description = "Accept tax-table PDFs, extract and normalize tabular data, persist it, and expose it over a REST API."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "fastapi>=0.132",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local-adapter-only OCR: the tesseract binary cannot exist on Vercel, so
# pytesseract must never ride the main dependency list into a function
# bundle. The docker-compose worker installs with --extra ocr.
ocr = [
    "pytesseract>=0.3.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "mypy>=1.14",
    # Dev and CI exercise the local OCR adapter's tests, so the extra is
    # mirrored here; runtime images use the `ocr` extra instead.
    "pytesseract>=0.3.13",
    # Contract tests drive the FastAPI app through starlette's TestClient
    # (httpx transport); the OpenAPI export tool serializes to YAML.
    "httpx>=0.27",
    "pyyaml>=6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tax_tables"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The mapper prompt and its tests deliberately contain en/em dashes: dash
# semantics ("— means no tax imposed") and range separators ("$0 – $9,000")
# are the subject matter, not typos.
"src/tax_tables/adapters/anthropic_mapper.py" = ["RUF001"]
"tests/mapping/test_anthropic_mapper.py" = ["RUF001"]

[tool.ruff.lint.isort]
# Explicit so local and CI never disagree on import classification.
known-first-party = ["tax_tables", "tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
# None of the PDF/OCR libraries ship type stubs.
module = ["pdfplumber", "pdfplumber.*", "pytesseract", "pypdfium2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
