name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: tax
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tax -d tax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tax:tax@localhost:5433/tax
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      # --group infra: tests/infra synthesizes the stack in-process; without
      # the group those tests would skip and the audit pins would not run.
      - run: uv sync --group infra
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make check

  # Phase 4 gate on every push: cdk synth with NO AWS credentials (cdk-nag
  # runs as an aspect; an unsuppressed error fails the synth), then
  # cfn-lint over the synthesized template. GitHub runners hold no AWS
  # credentials, so the offline property is enforced, not assumed.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: uv python install
      - run: uv sync --group infra
      - run: make synth-check
