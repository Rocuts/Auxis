name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tax
          POSTGRES_PASSWORD: tax
          POSTGRES_DB: tax
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tax -d tax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tax:tax@localhost:5433/tax
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
      - run: uv sync
      - run: make check
